name: Build patched release

# Every few hours: if PdfCraft has a release this repository hasn't built yet, apply the patches
# in patches/ to it, build Windows x64 and macOS (Apple silicon), and publish them here under the
# same tag. The patched app's updater reads this repository's releases.
#
# If the patches no longer apply to a new release, the "plan" job fails and nothing is published;
# the last patched release stays current until the patches are rebased.

on:
  schedule:
    - cron: "17 */4 * * *"
  workflow_dispatch:
    inputs:
      tag:
        description: "Upstream tag to build, e.g. v0.22.0 (empty: the latest release)"
        type: string
        default: ""
      rebuild:
        description: "Build and replace the files even if this tag is already released here"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  UPSTREAM: storytold/pdfcraft
  GIT_COMMITTER_NAME: pdfcraft-patched
  GIT_COMMITTER_EMAIL: pdfcraft-patched@users.noreply.github.com
  GIT_AUTHOR_NAME: pdfcraft-patched
  GIT_AUTHOR_EMAIL: pdfcraft-patched@users.noreply.github.com

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      tag: ${{ steps.p.outputs.tag }}
      version: ${{ steps.p.outputs.version }}
      build: ${{ steps.p.outputs.build }}
      fonts: ${{ steps.apply.outputs.fonts }}
      date: ${{ steps.p.outputs.date }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: _patched
          persist-credentials: false
      - id: p
        name: Pick the release
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.tag }}
          REBUILD: ${{ inputs.rebuild }}
        run: |
          tag="${INPUT_TAG:-$(gh release view -R "$UPSTREAM" --json tagName -q .tagName)}"
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || { echo "::error::odd tag '$tag'"; exit 1; }
          build=true
          if [ "$REBUILD" != true ] && gh release view "$tag" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            build=false
            echo "$tag is already built here."
          fi
          { echo "tag=$tag"; echo "version=${tag#v}"; echo "build=$build"; echo "date=$(date -u +%F)"; } >>"$GITHUB_OUTPUT"
      - id: apply
        name: Check the patches apply
        if: steps.p.outputs.build == 'true'
        env:
          TAG: ${{ steps.p.outputs.tag }}
        run: |
          git clone -q --filter=blob:none "https://github.com/$UPSTREAM.git" src
          cd src
          git checkout -q "$TAG"
          if ! git am -q --3way ../_patched/patches/*.patch; then
            echo "::error::The patches no longer apply to $TAG. Rebase them (see README) and run this workflow again."
            exit 1
          fi
          fonts=$(grep -oP 'craft-fonts-ref:\s*\K[0-9a-f]{40}' .github/workflows/release.yml | head -1)
          [ -n "$fonts" ] || { echo "::error::no craft-fonts pin in upstream release.yml"; exit 1; }
          echo "fonts=$fonts" >>"$GITHUB_OUTPUT"

  windows:
    needs: plan
    if: needs.plan.outputs.build == 'true'
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: 0
      VERSION: ${{ needs.plan.outputs.version }}
      BUILD_DATE: ${{ needs.plan.outputs.date }}
    steps:
      # Patches have LF line endings; keep the checkout LF too.
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.UPSTREAM }}
          ref: ${{ needs.plan.outputs.tag }}
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: _patched
          persist-credentials: false
      - name: Apply the patches
        shell: bash
        run: git am -q --3way _patched/patches/*.patch
      - uses: storytold/craft-common-actions/actions/export-app-build-env@main
        with:
          app-name: pdfcraft
          version: ${{ needs.plan.outputs.version }}
          date: ${{ needs.plan.outputs.date }}
      - uses: storytold/craft-common-actions/actions/checkout-craft-fonts@main
        with:
          ref: ${{ needs.plan.outputs.fonts }}
      - uses: storytold/craft-common-actions/actions/checkout-craft-i18n@main
      - id: rust
        uses: storytold/craft-common-actions/actions/rust-channel@main
        with:
          targets: x86_64-pc-windows-msvc
      - uses: step-security/dtolnay-rust-toolchain@8dd607977d06adf4ed49b190381e74c17a9dd25f # v1.0.0
        with:
          toolchain: ${{ steps.rust.outputs.toolchain }}
          targets: ${{ steps.rust.outputs.targets }}
          components: ${{ steps.rust.outputs.components }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: windows-x64
      - uses: storytold/craft-common-actions/actions/install-wix@main
      - name: Build and package (unsigned)
        shell: pwsh
        env:
          CRAFT_FONTS_DIR: ${{ github.workspace }}/craft-fonts
          CRAFT_FONTS_REQUIRED: "1"
        run: ./packaging/windows/package.ps1 -Arch x64
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-windows-x64
          path: dist/release/*
          if-no-files-found: error

  macos:
    needs: plan
    if: needs.plan.outputs.build == 'true'
    runs-on: macos-15
    timeout-minutes: 120
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: 0
      VERSION: ${{ needs.plan.outputs.version }}
      BUILD_DATE: ${{ needs.plan.outputs.date }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.UPSTREAM }}
          ref: ${{ needs.plan.outputs.tag }}
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: _patched
          persist-credentials: false
      - name: Apply the patches
        run: git am -q --3way _patched/patches/*.patch
      - uses: storytold/craft-common-actions/actions/export-app-build-env@main
        with:
          app-name: pdfcraft
          version: ${{ needs.plan.outputs.version }}
          date: ${{ needs.plan.outputs.date }}
      - uses: storytold/craft-common-actions/actions/checkout-craft-fonts@main
        with:
          ref: ${{ needs.plan.outputs.fonts }}
      - uses: storytold/craft-common-actions/actions/checkout-craft-i18n@main
      - id: rust
        uses: storytold/craft-common-actions/actions/rust-channel@main
        with:
          targets: aarch64-apple-darwin
      - uses: step-security/dtolnay-rust-toolchain@8dd607977d06adf4ed49b190381e74c17a9dd25f # v1.0.0
        with:
          toolchain: ${{ steps.rust.outputs.toolchain }}
          targets: ${{ steps.rust.outputs.targets }}
          components: ${{ steps.rust.outputs.components }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: macos-aarch64
      - name: Build and package (ad-hoc signed)
        env:
          CRAFT_FONTS_DIR: ${{ github.workspace }}/craft-fonts
          CRAFT_FONTS_REQUIRED: "1"
        run: packaging/macos/package.sh --arch aarch64
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-macos-aarch64
          path: dist/release/*
          if-no-files-found: error

  publish:
    needs: [plan, windows, macos]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          path: out
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.plan.outputs.tag }}
        run: |
          cd out
          rm -f SHA256SUMS.txt
          sha256sum -- * > ../SHA256SUMS.txt && mv ../SHA256SUMS.txt .
          {
            echo "PdfCraft $TAG ([official release](https://github.com/$UPSTREAM/releases/tag/$TAG)) with these patches:"
            echo
            for p in ../patches/*.patch; do echo "- $(awk '/^Subject: /{s=$0; sub(/^Subject: (\[PATCH[^]]*\] )?/,"",s); on=1; next} on&&/^ /{s=s $0; next} on{print s; exit}' "$p")"; done
            echo
            echo "Unsigned builds. Windows: use the portable zip. macOS: Apple silicon, ad-hoc signed (see README)."
          } > ../notes.md
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" -- * --clobber
            gh release edit "$TAG" --notes-file ../notes.md
          else
            gh release create "$TAG" --title "PdfCraft $TAG (patched)" --notes-file ../notes.md -- *
          fi
